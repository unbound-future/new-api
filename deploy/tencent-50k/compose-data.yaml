services:
  postgres:
    image: postgres:16.14-bookworm
    container_name: newapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-newapi}
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - max_connections=2500
      - -c
      - shared_buffers=16GB
      - -c
      - effective_cache_size=64GB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_completion_target=0.9
    ports:
      - "${DATA_NODE_PRIVATE_IP:-10.0.0.14}:5432:5432"
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newapi} -d ${POSTGRES_DB:-newapi}"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: &default-logging
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"

  redis:
    image: redis:7.4.7-bookworm
    container_name: newapi-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --maxmemory
      - 32gb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${DATA_NODE_PRIVATE_IP:-10.0.0.14}:6379:6379"
    volumes:
      - /data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      TZ: Asia/Shanghai
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:f3f6c013eee7f922b130078afc77626e72d37b4071b85ba92a675aa002d59e34
    container_name: newapi-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-newapi_logs}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-newapi}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: Asia/Shanghai
    ports:
      - "${DATA_NODE_PRIVATE_IP:-10.0.0.14}:9000:9000"
      - "${DATA_NODE_PRIVATE_IP:-10.0.0.14}:8123:8123"
    volumes:
      - /data/clickhouse:/var/lib/clickhouse
      - ./clickhouse/schema.sql.tpl:/docker-entrypoint-initdb.d/10-newapi-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 60
    logging: *default-logging

  new-api:
    image: ${NEWAPI_IMAGE:?NEWAPI_IMAGE must be set to an immutable digest}
    container_name: new-api
    restart: unless-stopped
    command: --log-dir /var/log/new-api
    env_file:
      - /etc/newapi/newapi.env
    expose:
      - "3000"
    volumes:
      - /data/newapi/coslog:/var/lib/new-api/coslog
      - /data/newapi/logs:/var/log/new-api
    stop_grace_period: 15m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck: &newapi-healthcheck
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:3000/api/status | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    ulimits: &newapi-ulimits
      nofile:
        soft: 1048576
        hard: 1048576
    logging: *default-logging

  nginx:
    image: nginx:1.28.2-alpine
    container_name: newapi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      new-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/status | grep -Eq '\"success\"[[:space:]]*:[[:space:]]*true'"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging
